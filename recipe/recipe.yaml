schema_version: 1

context:
  name: irispy-lmsal
  version: "0.9.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 520d1c0a3b415feb41890a8cd41351fea7a2a3aafb2c70b47627619f38bc7253

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - astropy-base >=7.2.0
    - dkist >=1.17.0
    - gwcs >=1.0.0
    - dask >=2024.7.0
    - mpl_animators >=1.2.0
    - ndcube >=2.4.0
    - pandas >=3.0.0
    - scipy >=1.17.0
    - sunpy >=7.1.0
    - sunraster >=0.7.0

tests:
  - python:
      imports:
        - irispy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - pooch
        - python ${{ python_min }}.*
        - pytest-astropy
        - pytest-mpl
        - ffmpeg
        - astroscrappy
    script:
      - pytest --pyargs irispy --remote-data=none -k "not test_remove_cosmic_rays_rsliding"

about:
  summary: Provides tools to read in and analyze data from the IRIS solar-observing satellite.
  license: BSD-3-Clause
  license_file: licenses/LICENSE.rst
  homepage: https://iris.lmsal.com/

extra:
  recipe-maintainers:
    - nabobalis
